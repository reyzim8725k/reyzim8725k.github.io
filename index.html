<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1c"><meta name="description" content="Calcura — calculadora rápida, científica e acessível."><link rel="icon" type="image/png" href="assets/calcura-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><title>Calcura — calculadora premium</title>
<style>
:root{color-scheme:dark;--bg:#080b18;--panel:rgba(15,20,42,.72);--panel2:rgba(255,255,255,.07);--text:#f7f8ff;--muted:#9ba5c7;--line:rgba(255,255,255,.13);--accent:#8b7cff;--accent2:#59d7ff;--op:#ffb86b;--danger:#ff7188;--shadow:0 28px 80px rgba(0,0,0,.38);--radius:26px}[data-theme=light]{color-scheme:light;--bg:#eef2ff;--panel:rgba(255,255,255,.78);--panel2:rgba(39,49,98,.07);--text:#171b35;--muted:#626b89;--line:rgba(31,39,78,.14);--accent:#5948dc;--accent2:#098bb4;--op:#bd6500;--danger:#c83250;--shadow:0 28px 80px rgba(54,60,115,.18)}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,rgba(49,38,125,.7),transparent 38%),url('assets/calcura-background.png') center/cover;opacity:.26}body:after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 20%,rgba(103,86,255,.18),transparent 30%),radial-gradient(circle at 85% 85%,rgba(60,211,255,.14),transparent 30%);animation:drift 16s ease-in-out infinite alternate}@keyframes drift{to{transform:translate3d(2%,-2%,0) scale(1.04)}}button,input{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{width:min(1160px,100%);margin:auto;padding:28px 18px 34px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:46px;height:46px;border-radius:14px;box-shadow:0 10px 26px rgba(100,85,255,.32)}.brand strong{display:block;font:700 24px/1 Space Grotesk,sans-serif;letter-spacing:-.04em}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.toolbar{display:flex;gap:9px}.icon-btn,.pill{min-height:42px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);border-radius:14px;transition:.2s ease}.icon-btn{width:42px;font-size:18px}.icon-btn:hover,.pill:hover{transform:translateY(-2px);background:var(--panel2)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}.calculator,.history{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(22px);box-shadow:var(--shadow);border-radius:var(--radius)}.calculator{padding:22px}.calc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.mode-switch{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel2)}.mode-switch button{padding:8px 11px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}.mode-switch button[aria-pressed=true]{color:var(--text);background:linear-gradient(135deg,var(--accent),#9b76ff);box-shadow:0 5px 16px rgba(120,95,255,.26)}.display{min-height:156px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(0,0,0,.19),var(--panel2));overflow:hidden}.expression{width:100%;min-height:24px;color:var(--muted);text-align:right;font-size:15px;overflow-wrap:anywhere}.result{width:100%;margin-top:8px;color:var(--text);text-align:right;font:600 clamp(38px,7vw,60px)/1 Space Grotesk,sans-serif;letter-spacing:-.055em;overflow-wrap:anywhere}.result.pop{animation:pop .22s ease}@keyframes pop{50%{transform:scale(1.035);color:var(--accent2)}}.status{min-height:24px;padding:8px 2px 0;color:var(--danger);text-align:right;font-size:12px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}.key{position:relative;isolation:isolate;min-height:62px;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:var(--panel2);font-size:20px;font-weight:600;transition:transform .14s ease,background .2s ease,box-shadow .2s ease}.key:hover{background:rgba(139,124,255,.17);box-shadow:0 8px 20px rgba(0,0,0,.1);transform:translateY(-2px)}.key:active{transform:scale(.95)}.key:focus-visible,.icon-btn:focus-visible,.mode-switch button:focus-visible,.pill:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.key.fn{color:var(--muted);font-size:15px}.key.op{color:var(--op);background:rgba(255,184,107,.1)}.key.equal{background:linear-gradient(135deg,var(--accent),#a866ef);color:#fff;box-shadow:0 10px 25px rgba(112,81,234,.28)}.key.scientific{display:none;font-size:15px}.scientific-on .key.scientific{display:block}.wide{grid-column:span 2}.hint{margin:16px 4px 0;color:var(--muted);font-size:11px;text-align:center}.history{min-height:510px;padding:20px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.history h2{margin:0;font:600 18px Space Grotesk,sans-serif}.pill{padding:8px 11px;color:var(--muted);font-size:11px}.history-list{display:flex;flex-direction:column;gap:9px;max-height:450px;overflow:auto}.history-item{padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--panel2);cursor:pointer;transition:.2s;text-align:left}.history-item:hover{border-color:var(--accent);transform:translateX(-2px)}.history-item small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.history-item strong{display:block;margin-top:6px;font-size:18px}.empty{padding:42px 10px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}.toast{position:fixed;z-index:5;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);font-size:13px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:780px){.workspace{grid-template-columns:1fr}.history{min-height:0}.history-list{max-height:260px}}@media(max-width:460px){.app{padding:17px 12px 28px}.calculator{padding:14px;border-radius:22px}.display{min-height:135px;padding:17px}.key{min-height:57px;border-radius:14px}.keys{gap:7px}.scientific-on .keys{grid-template-columns:repeat(5,1fr)}.topbar{margin-bottom:15px}.brand img{width:40px;height:40px}.brand strong{font-size:21px}.brand span{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main class="app"><header class="topbar"><div class="brand"><img src="assets/calcura-icon.png" alt="" width="46" height="46"><div><strong>Calcura</strong><span>Precisão que acompanha seu ritmo</span></div></div><div class="toolbar"><button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema" title="Alternar tema">☼</button><button class="icon-btn" id="copyBtn" type="button" aria-label="Copiar resultado" title="Copiar resultado">⧉</button></div></header><section class="workspace"><section class="calculator" aria-label="Calculadora Calcura"><div class="calc-head"><span class="eyebrow">Calculadora</span><div class="mode-switch" aria-label="Modo da calculadora"><button id="basicMode" aria-pressed="true">Básico</button><button id="sciMode" aria-pressed="false">Científico</button></div></div><div class="display" aria-live="polite" aria-atomic="true"><div class="expression" id="expression">Pronto para calcular</div><div class="result" id="result">0</div><div class="status" id="status" role="status"></div></div><div class="keys" id="keys">
<button class="key fn" data-action="clear" aria-label="Limpar tudo">AC</button><button class="key fn" data-action="backspace" aria-label="Apagar último caractere">⌫</button><button class="key fn" data-insert="(" aria-label="Abrir parêntese">(</button><button class="key op" data-insert="/" aria-label="Divisão">÷</button>
<button class="key scientific" data-fn="sin(" aria-label="Seno">sin</button><button class="key scientific" data-fn="cos(" aria-label="Cosseno">cos</button><button class="key scientific" data-fn="tan(" aria-label="Tangente">tan</button><button class="key scientific" data-fn="log(" aria-label="Logaritmo">log</button><button class="key scientific" data-fn="ln(" aria-label="Logaritmo natural">ln</button>
<button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key op" data-insert="*" aria-label="Multiplicação">×</button>
<button class="key scientific" data-insert="π" aria-label="Pi">π</button><button class="key scientific" data-insert="e" aria-label="Número de Euler">e</button><button class="key scientific" data-insert="^" aria-label="Potência">xʸ</button><button class="key scientific" data-insert="!" aria-label="Fatorial">n!</button><button class="key scientific" data-action="sqrt" aria-label="Raiz quadrada">√</button>
<button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key op" data-insert="-" aria-label="Subtração">−</button>
<button class="key scientific" data-insert=")" aria-label="Fechar parêntese">)</button><button class="key scientific" data-action="sign" aria-label="Trocar sinal">±</button><button class="key scientific" data-action="percent" aria-label="Porcentagem">%</button><button class="key scientific" data-action="copy" aria-label="Copiar resultado">Copiar</button><button class="key scientific" data-action="backspace" aria-label="Apagar">⌫</button>
<button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key op" data-insert="+" aria-label="Adição">+</button>
<button class="key wide" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key equal" data-action="equals" aria-label="Calcular resultado">=</button></div><p class="hint">Teclado: números, + − × ÷, parênteses, Enter, Esc e Backspace</p></section><aside class="history" aria-label="Histórico de cálculos"><div class="history-head"><h2>Histórico</h2><button class="pill" id="clearHistory" type="button">Limpar</button></div><div class="history-list" id="historyList"></div></aside></section></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),result=$('#result'),expression=$('#expression'),status=$('#status'),keys=$('#keys'),toast=$('#toast');let input='',justCalculated=false;const HISTORY_KEY='calcura-history-v1',THEME_KEY='calcura-theme-v1',isOp=t=>['+','-','*','/','^'].includes(t);const showToast=msg=>{toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2200)},pretty=s=>s.replace(/\*/g,'×').replace(/\//g,'÷').replace(/sqrt/g,'√').replace(/pi/g,'π');function render(){result.textContent=input?pretty(input):'0';expression.textContent=input?pretty(input):'Pronto para calcular';result.classList.remove('pop');void result.offsetWidth;result.classList.add('pop')}function tokenize(s){const out=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}if(/[0-9.]/.test(c)){let n='';while(i<s.length&&/[0-9.]/.test(s[i]))n+=s[i++];if((n.match(/\./g)||[]).length>1||n==='.')throw Error('Número inválido');out.push({t:'num',v:Number(n)});continue}if(/[a-z]/i.test(c)){let w='';while(i<s.length&&/[a-z]/i.test(s[i]))w+=s[i++].toLowerCase();if(!['sin','cos','tan','log','ln','sqrt'].includes(w))throw Error('Função desconhecida');out.push({t:'fn',v:w});continue}if(c==='π'){out.push({t:'num',v:Math.PI});i++;continue}if(c==='e'){out.push({t:'num',v:Math.E});i++;continue}if('+-*/^%!()'.includes(c)){out.push({t:c,v:c});i++;continue}throw Error('Caractere inválido')}return out}function evaluate(s){const ts=tokenize(s),vals=[],ops=[],prec={'+':1,'-':1,'*':2,'/':2,'%':3,'^':4,'!':5};const apply=op=>{if(op==='!'){let a=vals.pop();if(!Number.isFinite(a)||a<0||a>170||Math.floor(a)!==a)throw Error('Fatorial inválido');let r=1;for(let j=2;j<=a;j++)r*=j;vals.push(r);return}if(op==='%'){let a=vals.pop();vals.push(a/100);return}let b=vals.pop(),a=vals.pop();if(a===undefined||b===undefined)throw Error('Expressão incompleta');if(op==='/'&&b===0)throw Error('Não é possível dividir por zero');vals.push(op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:op==='/'?a/b:Math.pow(a,b))};let expect=true;for(const x of ts){if(x.t==='num'){vals.push(x.v);expect=false;continue}if(x.t==='fn'){ops.push(x.v);expect=true;continue}if(x.t==='('){ops.push(x.t);expect=true;continue}if(x.t===')'){while(ops.length&&ops.at(-1)!=='(')apply(ops.pop());if(ops.pop()!=='(')throw Error('Parênteses desequilibrados');if(ops.length&&['sin','cos','tan','log','ln','sqrt'].includes(ops.at(-1)))apply(ops.pop());expect=false;continue}if(['+','-'].includes(x.t)&&expect){if(x.t==='-')vals.push(0);else continue}if(isOp(x.t)||x.t==='%'||x.t==='!'){while(ops.length&&ops.at(-1)!=='('&&!['sin','cos','tan','log','ln','sqrt'].includes(ops.at(-1))&&((prec[ops.at(-1)]>prec[x.t])||(prec[ops.at(-1)]===prec[x.t]&&x.t!=='^')))apply(ops.pop());ops.push(x.t);expect=x.t!=='%'&&x.t!=='!'}}while(ops.length){const op=ops.pop();if(op==='(')throw Error('Parênteses desequilibrados');if(['sin','cos','tan','log','ln','sqrt'].includes(op)){let a=vals.pop();if(op==='sqrt'&&a<0)throw Error('Raiz de número negativo');if((op==='log'||op==='ln')&&a<=0)throw Error('Logaritmo inválido');vals.push(op==='sin'?Math.sin(a):op==='cos'?Math.cos(a):op==='tan'?Math.tan(a):op==='log'?Math.log10(a):op==='ln'?Math.log(a):Math.sqrt(a))}else apply(op)}if(vals.length!==1||!Number.isFinite(vals[0]))throw Error('Resultado inválido');return Number(vals[0].toPrecision(12))}const readHistory=()=>JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');function drawHistory(){const h=readHistory();$('#historyList').innerHTML=h.length?h.map((x,i)=>`<button class="history-item" data-history="${i}" aria-label="Reutilizar ${pretty(x.expr)} igual a ${x.result}"><small>${pretty(x.expr)}</small><strong>= ${x.result}</strong></button>`).join(''):'<div class="empty">Seus cálculos recentes<br>aparecerão aqui.</div>'}function addHistory(expr,val){const h=[{expr,result:String(val)},...readHistory().filter(x=>x.expr!==expr)].slice(0,20);localStorage.setItem(HISTORY_KEY,JSON.stringify(h));drawHistory()}function calculate(){if(!input)return;try{const expr=input,val=evaluate(input);input=String(val);expression.textContent=pretty(expr)+' =';status.textContent='';justCalculated=true;addHistory(expr,val);result.classList.add('pop')}catch(e){status.textContent=e.message||'Não foi possível calcular';showToast(status.textContent)}}function insert(v){if(justCalculated&&!isOp(v)&&v!==')'&&v!=='!'){input='';justCalculated=false}if(v==='.'&&(/[.]\d*$/.test(input)))return;if(isOp(v)&&isOp(input.at(-1)))input=input.slice(0,-1);input+=v;status.textContent='';render()}function backspace(){input=input.slice(0,-1);justCalculated=false;render()}function toggleTheme(){const root=document.documentElement,next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;localStorage.setItem(THEME_KEY,next)}function copy(){navigator.clipboard?.writeText(input||result.textContent).then(()=>showToast('Resultado copiado')).catch(()=>showToast('Selecione e copie manualmente'))}keys.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.insert;if(v!==undefined)insert(v);else if(b.dataset.fn)insert(b.dataset.fn);else if(b.dataset.action==='equals')calculate();else if(b.dataset.action==='clear'){input='';status.textContent='';render()}else if(b.dataset.action==='backspace')backspace();else if(b.dataset.action==='sqrt')insert('sqrt(');else if(b.dataset.action==='sign'){input=input.startsWith('-')?input.slice(1):'-'+input;render()}else if(b.dataset.action==='percent')insert('%');else if(b.dataset.action==='copy')copy()});$('#copyBtn').onclick=copy;$('#themeBtn').onclick=toggleTheme;$('#clearHistory').onclick=()=>{localStorage.removeItem(HISTORY_KEY);drawHistory();showToast('Histórico limpo')};$('#basicMode').onclick=()=>{document.body.classList.remove('scientific-on');$('#basicMode').setAttribute('aria-pressed','true');$('#sciMode').setAttribute('aria-pressed','false')};$('#sciMode').onclick=()=>{document.body.classList.add('scientific-on');$('#basicMode').setAttribute('aria-pressed','false');$('#sciMode').setAttribute('aria-pressed','true')};$('#historyList').onclick=e=>{const b=e.target.closest('[data-history]');if(!b)return;input=readHistory()[b.dataset.history].expr;justCalculated=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='='){e.preventDefault();calculate()}else if(e.key==='Escape'){input='';status.textContent='';render()}else if(e.key==='Backspace')backspace();else if(/^[0-9.+\-*/^%()!]$/.test(e.key))insert(e.key)});const saved=localStorage.getItem(THEME_KEY);if(saved)document.documentElement.dataset.theme=saved;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light';drawHistory();render()})();
</script></body></html>
